# ============================================================
#  Debian 12 (Bookworm) 自动安装 preseed —— 雷电面板
#  root/SSH 密码：Xzc345963；首次开机自动安装雷电面板。
# ============================================================

### 语言 / 键盘
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### 网络（DHCP）
d-i netcfg/choose_interface select auto
d-i netcfg/disable_dhcp boolean false
d-i netcfg/get_hostname string leidian
d-i netcfg/get_domain string local

### 安装源（国内清华镜像，快）
d-i mirror/country string manual
d-i mirror/http/hostname string mirrors.tuna.tsinghua.edu.cn
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### 时钟
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai
d-i clock-setup/ntp boolean true

### 分区（整盘，自动；目标盘由内核参数 partman-auto/disk 指定）
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### root 账号（允许 root 登录）
d-i passwd/root-login boolean true
d-i passwd/root-password password Xzc345963
d-i passwd/root-password-again password Xzc345963
d-i passwd/make-user boolean false

### 软件包
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string curl wget ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### 引导
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### 收尾：允许 root SSH 登录 + 写入"首次开机自动装雷电面板"服务
d-i preseed/late_command string in-target sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config; in-target sh -c 'printf "%s\n" "#!/bin/bash" "sleep 25" "curl -fsSL https://cdn.jsdelivr.net/gh/scaryburial/leidian-panel@main/install.sh | bash || curl -fsSL https://raw.githubusercontent.com/scaryburial/leidian-panel/main/install.sh | bash" "systemctl disable firstboot.service" "rm -f /usr/local/bin/firstboot.sh" > /usr/local/bin/firstboot.sh'; in-target chmod +x /usr/local/bin/firstboot.sh; in-target sh -c 'printf "%s\n" "[Unit]" "Description=First boot install leidian panel" "After=network-online.target" "Wants=network-online.target" "" "[Service]" "Type=oneshot" "ExecStart=/usr/local/bin/firstboot.sh" "" "[Install]" "WantedBy=multi-user.target" > /etc/systemd/system/firstboot.service'; in-target systemctl enable firstboot.service

### 完成重启
d-i finish-install/reboot_in_progress note
